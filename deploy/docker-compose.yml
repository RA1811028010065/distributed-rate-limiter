services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - rate-limit-net
  rate-limiter:
    build: ..
    environment:
      - NATS_URL=nats://nats:4222
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - nats
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - rate-limit-net

networks:
  rate-limit-net:
    driver: bridge
    name: ${RATE_LIMITER_NETWORK:-ratelimiter_net}
    ipam:
      config:
        - subnet: ${RATE_LIMITER_SUBNET:-172.31.255.0/28}
